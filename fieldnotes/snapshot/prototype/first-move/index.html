<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First Move — buying cover with an assistant</title>
<meta name="description" content="A reconstruction of what a general assistant can already do when someone shops for insurance — and the step that stays hers.">
<link rel="icon" href="../../favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body class="fm">

<button class="skip" type="button" id="skip">Skip to this screen's content</button>

<!-- filters the headline backing borrows (a rough edge on a CSS pseudo-element) -->
<svg class="fm-defs" aria-hidden="true" focusable="false" width="0" height="0">
  <defs>
    <filter id="rough" x="-4%" y="-6%" width="108%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="9" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<!-- ═══════════════ THE GROUND ═══════════════
     One charcoal field under both screens: a faint texture of receding
     documents. Drawn in app.js — no images, no external request. -->
<div class="world" id="world">
  <svg id="field" preserveAspectRatio="none" aria-hidden="true" focusable="false"></svg>
</div>

<main class="deck" id="deck">

<!-- ══════ 1 · WHAT IT ALREADY DOES ══════════════════════════════════════
     One flow: four quotes → the two clauses that matter to this household
     → one recommended quote. Text is HTML in flow; the drawing is one SVG
     laid out in CSS pixels, so its labels are the same size as the type. -->
<section class="screen fm-sc fm-s1" data-screen="1" data-label="What it already does">

  <header class="fm-head" id="s1-head">
    <h1 class="display fm-headline" tabindex="-1"><span>She stopped reading</span> <span>the policies herself.</span></h1>
    <p class="fm-lede">Four quotes compared against her needs.</p>
  </header>

  <svg class="fm-scene" id="scene1" role="img"
       aria-label="Four renewal quotes, Quote A to Quote D, fanned on a dark field. One reasoning path runs through all four and pulls two clauses out onto the path: a garage exclusion, marked on Quote B and Quote C, and a prior claim, rated at a different point on each of the four. The cheapest quote, Quote C, is marked ranked third. The path arrives at Quote D, lifted out of the fan and marked Recommended, not the cheapest, then runs on toward the right edge."></svg>

  <div class="fm-foot" id="s1-foot">
    <button class="fm-run" type="button" id="read-play">Run it again</button>
    <p class="fm-micro">Invented person and quotes. A reconstruction, not a recording.</p>
  </div>

</section>

<!-- ══════ 2 · WHERE IT STOPS ═════════════════════════════════════════════
     The same path, carried on from the recommendation, meets a wall the
     assistant does not pass. The purchase beyond it is hers to make.
     Headline → wall → question. -->
<section class="screen fm-sc fm-s2" data-screen="2" data-label="Where it stops">

  <header class="fm-head" id="s2-head">
    <h2 class="display fm-headline" tabindex="-1"><span>The recommendation is ready.</span> <span>You complete the purchase.</span></h2>
  </header>

  <svg class="fm-scene" id="scene2" role="img"
       aria-label="The recommended quote sits at the left with the other three faded behind it. The reasoning path runs from it straight into a solid warm wall that spans the stage and carries five words: Buy, Bind, Sign, Identity, Payment. The path scatters against the wall and does not pass. Beyond the wall, drawn only as a dashed outline, is the bound policy."></svg>

  <div class="fm-ask" id="s2-ask">
    <p class="fm-ask-q" tabindex="-1">What happens when she delegates the next step too?</p>
  </div>

</section>

</main>

<div class="chrome">
  <div class="chrome-r">
    <button class="iconbtn" type="button" id="prev" aria-label="Previous screen">
      <span aria-hidden="true">&larr;</span>
    </button>
    <label class="picker">
      <span class="sr-only">Choose a screen</span>
      <select id="picker"></select>
    </label>
    <button class="cta" type="button" id="next">
      <span id="next-label">Where it stops</span> <span aria-hidden="true">&rarr;</span>
    </button>
  </div>
</div>

<p class="sr-only" id="announce" role="status" aria-live="polite"></p>
<p class="sr-only" id="state-status" role="status" aria-live="polite"></p>

<script src="app.js"></script>
</body>
</html>
